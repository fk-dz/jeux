<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="أفعى نيون — لعبة ثعبان سريعة بتحكم دقيق، تأثيرات جسيمات، اهتزاز شاشة، وجدول أعلى النتائج."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rubik:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>أفعى نيون · لعبة الثعبان السريعة</title>

    <!-- Critical inline styles: the page is never white, even before JS runs. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070f;
        color: #e6edff;
        overflow: hidden;
      }
      body {
        font-family: "Cairo", "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100%;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 100% at 50% 0%, #0d1430 0%, #05070f 65%);
        text-align: center;
        padding: 1.5rem;
        z-index: 9999;
      }
      .boot__orb {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 2rem;
        border: 1px solid rgba(110, 247, 196, 0.28);
        background: rgba(110, 247, 196, 0.1);
        box-shadow: 0 0 44px -8px rgba(110, 247, 196, 0.75);
        animation: bootFloat 2.6s ease-in-out infinite;
      }
      .boot__title {
        margin: 0;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(100deg, #6ef7c4, #35d6ff 40%, #a78bfa 70%, #6ef7c4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot__sub {
        margin: 0.4rem 0 0;
        font-size: 0.72rem;
        font-weight: 700;
        color: rgba(230, 237, 255, 0.42);
      }
      .boot__bar {
        width: 150px;
        height: 3px;
        margin: 1.15rem auto 0;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
      }
      .boot__bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #6ef7c4, #35d6ff);
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      .boot__warn {
        display: none;
        margin: 1.1rem auto 0;
        max-width: 22rem;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.75;
        color: rgba(255, 143, 163, 0.9);
        background: rgba(255, 93, 115, 0.1);
        border: 1px solid rgba(255, 93, 115, 0.25);
        border-radius: 0.9rem;
        padding: 0.7rem 0.9rem;
      }
      .boot.is-stuck .boot__warn {
        display: block;
      }
      .boot.is-stuck .boot__bar {
        display: none;
      }
      @keyframes bootFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes bootSlide {
        0% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(-320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__orb,
        .boot__bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: replaced as soon as React mounts -->
      <div class="boot" id="boot">
        <div>
          <div class="boot__orb">🐍</div>
          <h1 class="boot__title">أفعى نيون</h1>
          <p class="boot__sub">جارٍ تجهيز الساحة…</p>
          <div class="boot__bar"><i></i></div>
          <p class="boot__warn">
            لم تُحمَّل اللعبة. إذا كانت هذه النسخة المصدرية من الملف، شغّل
            <span style="direction: ltr; unicode-bidi: embed">npm run build</span> ثم افتح ملف
            <span style="direction: ltr; unicode-bidi: embed">dist/index.html</span> — فهو نسخة مستقلة بذاتها.
          </p>
        </div>
      </div>
    </div>

    <script>
      // Watchdog: surfaces a helpful hint instead of a silent blank screen.
      (function () {
        var root = document.getElementById("root");
        var boot = document.getElementById("boot");
        if (!root || !boot) return;
        var check = window.setTimeout(function () {
          if (root.dataset.booted !== "1") boot.classList.add("is-stuck");
        }, 3500);
        window.addEventListener("load", function () {
          if (root.dataset.booted === "1") window.clearTimeout(check);
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
